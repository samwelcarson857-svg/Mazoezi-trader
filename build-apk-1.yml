name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create the Android project
        run: |
          mkdir -p android/app/src/main/assets android/app/src/main/java/com/mazoezi/trader android/app/src/main/res/drawable
          cat > android/settings.gradle <<'MZEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MazoeziTrader"
          include ':app'
          MZEOF
          cat > android/build.gradle <<'MZEOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          MZEOF
          cat > android/gradle.properties <<'MZEOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          MZEOF
          cat > android/app/build.gradle <<'MZEOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mazoezi.trader'
              compileSdk 34

              defaultConfig {
                  applicationId "com.mazoezi.trader"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          MZEOF
          cat > android/app/src/main/AndroidManifest.xml <<'MZEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Mazoezi Trader"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MZEOF
          cat > android/app/src/main/java/com/mazoezi/trader/MainActivity.java <<'MZEOF'
          package com.mazoezi.trader;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if ("file".equals(uri.getScheme())) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (Exception ignored) {
                          }
                          return true;
                      }
                  });

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl("file:///android_asset/index.html");
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  web.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          MZEOF
          cat > android/app/src/main/res/drawable/ic_launcher.xml <<'MZEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0C5C7C"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M28,62h14v20h-14z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M47,50h14v32h-14z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M66,36h14v46h-14z" />
          </vector>
          MZEOF
          cp mazoezi-trader.html android/app/src/main/assets/index.html

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Publish APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Mazoezi-Trader.apk
          gh release create "v${{ github.run_number }}" Mazoezi-Trader.apk --title "Mazoezi Trader" --notes "Install Mazoezi-Trader.apk on your phone."

      - uses: actions/upload-artifact@v4
        with:
          name: Mazoezi-Trader-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
